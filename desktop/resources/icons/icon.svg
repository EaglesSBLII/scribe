<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Scribe: your voice (the sound wave) arrives at the writing cursor. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aebc9"/>
      <stop offset="1" stop-color="#48b088"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#2c2c33" stroke-width="6"/>
  <!-- the voice: five bars on one centre line -->
  <g fill="url(#voice)">
    <rect x="236" y="442" width="58" height="140" rx="29"/>
    <rect x="336" y="352" width="58" height="320" rx="29"/>
    <rect x="436" y="262" width="58" height="500" rx="29"/>
    <rect x="536" y="377" width="58" height="270" rx="29"/>
    <rect x="636" y="452" width="58" height="120" rx="29"/>
  </g>
  <!-- the cursor, where the words land -->
  <rect x="758" y="302" width="30" height="420" rx="15" fill="#f1f1f3"/>
</svg>
