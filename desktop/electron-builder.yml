appId: com.scribe.essay
productName: Scribe
directories:
  output: dist-electron
files:
  - src/**
  - web/**
  - lib/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/models
    to: models
    filter:
      - "**/*"
      - "!**/*.tar.bz2"
      - "!**/*.part"
# The voice engine is a native library: it must sit outside the app archive to be loaded.
asarUnpack:
  - "**/node_modules/sherpa-onnx-*/**"
npmRebuild: false
# No certificate (identity: null below), so the bundle is signed ad-hoc here, before the dmg is made.
# The in-app updater downloads that dmg from the GitHub release: see docs/updates.md.
afterPack: scripts/adhoc-sign.js
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.education
  icon: resources/icons/icon.icns
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: Scribe listens to you so it can write down what you say. Audio never leaves this Mac.
electronVersion: 36.9.5
